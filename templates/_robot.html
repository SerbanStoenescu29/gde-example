<svg class="robot" viewBox="0 0 140 150" role="img" aria-label="Friendly robot assistant" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robotBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="robotShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse class="robot-shadow" cx="70" cy="144" rx="30" ry="5"/>

  <g class="robot-float">
    <!-- antenna -->
    <line x1="70" y1="24" x2="70" y2="10" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
    <circle class="robot-bulb" cx="70" cy="8" r="5"/>

    <!-- waving arm (behind body, drawn first) -->
    <g class="robot-wave">
      <rect x="103" y="82" width="9" height="26" rx="4.5" fill="url(#robotBody)"/>
      <circle cx="107.5" cy="110" r="6" fill="#a5b4fc"/>
    </g>
    <!-- resting arm -->
    <rect x="28" y="84" width="9" height="28" rx="4.5" fill="url(#robotBody)"/>
    <circle cx="32.5" cy="114" r="6" fill="#a5b4fc"/>

    <!-- body -->
    <rect x="40" y="88" width="60" height="38" rx="14" fill="url(#robotBody)"/>
    <rect x="40" y="88" width="60" height="19" rx="14" fill="url(#robotShine)"/>
    <circle class="robot-heart" cx="70" cy="107" r="6"/>

    <!-- head -->
    <rect x="22" y="26" width="96" height="64" rx="22" fill="url(#robotBody)"/>
    <rect x="22" y="26" width="96" height="32" rx="22" fill="url(#robotShine)"/>
    <rect x="14" y="48" width="9" height="20" rx="4.5" fill="#a5b4fc"/>
    <rect x="117" y="48" width="9" height="20" rx="4.5" fill="#a5b4fc"/>

    <!-- face -->
    <rect x="32" y="37" width="76" height="42" rx="15" fill="#0f1320"/>
    <g class="robot-eyes">
      <ellipse class="robot-eye" cx="53" cy="55" rx="7" ry="8"/>
      <ellipse class="robot-eye" cx="87" cy="55" rx="7" ry="8"/>
    </g>
    <path class="robot-mouth" d="M60 69 Q70 76 80 69" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
